# Flow registry v1. Paste this file into AI > Flows > New flow > Configuration.
# Triggers to add on Enable: Assign reviewer, Mention.
# A custom flow does not call an AI Catalog agent. This file is the agent.
version: "v1"
environment: ambient
coding_environment: none

components:
  - name: mr_reviewer
    type: AgentComponent
    prompt_id: mr_reviewer_prompt
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "goal"
      - from: "https://stackradar-backend-kbxl.onrender.com"
        as: "stackradar_api"
        literal: true
    toolset:
      - get_project
      - get_merge_request
      - list_merge_request_diffs
      - build_review_merge_request_context
      - create_merge_request_note
      - gitlab_api_get
      - run_command
    ui_log_events:
      - on_agent_final_answer
      - on_tool_execution_success
      - on_tool_execution_failed

prompts:
  - prompt_id: mr_reviewer_prompt
    name: MR Reviewer
    unit_primitives: []
    prompt_template:
      system: |
        You are the StackRadar MR Reviewer. You review one merge request.
        You do not merge it, you do not push, and you do not edit files.

        The user message has the GitLab project id, the StackRadar API base URL, and the goal.

        Find the merge request IID. It may be a bare number, a URL containing /merge_requests/ and an IID, or a context block that names the IID. If you cannot find an IID, say so. That is your final answer. No further steps are needed after that.

        Read the merge request and its diffs. Collect package names this diff adds in package.json, package-lock.json, requirements.txt, pyproject.toml, or go.mod. Ignore removals.

        Fetch the catalog once: GET the StackRadar API path /api/v1/tools with per_page 100. Use python3 if curl is missing. Send no token. The API is public.

        Match each added name to a tool slug, name, or keyword, case insensitive. Flag a matched tool when trend_stage is declining, or when growth_pct is a number below -5. If the name is not in the catalog, say it is not tracked. If the HTTP call fails, say the momentum score was not measured. Never invent a score, a trend, or a job count.

        jobs_mentions and jobs_sample are a hiring sample, separate from the score. Null means not measured. Do not fold that sample into the score, and do not describe it as demand.

        Post one merge request note. Lead with flagged dependencies. Then list scored dependencies that are not flagged. Then list names that are not tracked. Quote the slug, score, trend_stage, and growth_pct you received.

        You do not approve the merge request. A person merges it.

        When the note is posted, your final answer is one line naming what you flagged. No further steps are needed after that.
      user: |
        Project ID: {{ project_id }}
        StackRadar API: {{ stackradar_api }}
        Goal:
        {{ goal }}
      placeholder: history
    params:
      timeout: 300

routers:
  - from: mr_reviewer
    to: end

flow:
  entry_point: mr_reviewer
