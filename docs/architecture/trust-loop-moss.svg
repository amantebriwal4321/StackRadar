<svg viewBox="0 0 1580 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StackRadar's scrape pipeline: raw community and GitHub data flows through Moss semantic retrieval, then a Groq sentiment call wrapped in runtime guardrails and a grounding check, before deterministic scoring persists to the database and the API serves the frontend. When Moss is unconfigured or a query fails, a dashed fallback path routes straight to the grounding check using a regex match instead.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2430" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B78CE" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1580" height="520" fill="#FFFFFF" />

  <text x="30" y="30" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2430">StackRadar Trust Loop — Moss Fast Retrieval in the sentiment pipeline</text>
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="12.5" fill="#6B7280">Moss Zero-Latency Builder Sprint · track: Agent Reliability, Security and Evaluation</text>

  <!-- traced() bracket over Moss / Groq / Guardrails -->
  <path d="M 535 82 L 535 74 L 1245 74 L 1245 82" fill="none" stroke="#8A8F98" stroke-width="1" />
  <line x1="635" y1="74" x2="635" y2="82" stroke="#8A8F98" stroke-width="1" />
  <line x1="895" y1="74" x2="895" y2="82" stroke="#8A8F98" stroke-width="1" />
  <line x1="1150" y1="74" x2="1150" y2="82" stroke="#8A8F98" stroke-width="1" />
  <text x="890" y="68" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8A8F98">guardrails.traced() spans — durations logged today, OpenTelemetry export proposed</text>

  <!-- ══ Row 1: ingestion + trust loop (y 90–200) ══ -->

  <!-- Sources -->
  <rect x="30" y="90" width="185" height="90" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.5" />
  <text x="122" y="124" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2430">Community sources</text>
  <text x="122" y="143" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">GitHub · HN · Reddit</text>
  <text x="122" y="159" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">Dev.to · RSS news</text>

  <line x1="215" y1="135" x2="279" y2="135" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="247" y="128" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B7280">fetch</text>

  <!-- Scraper -->
  <rect x="283" y="90" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.5" />
  <text x="373" y="128" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2430">scraper.py</text>
  <text x="373" y="146" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">async fetch, per source</text>
  <text x="373" y="163" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8A8F98">SHIPPED</text>

  <line x1="463" y1="135" x2="527" y2="135" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="495" y="128" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B7280">headline</text>

  <!-- Moss (accent) -->
  <rect x="531" y="84" width="200" height="102" rx="8" fill="#EAF5FF" stroke="#0B78CE" stroke-width="2.5" />
  <text x="631" y="114" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0B78CE">Moss retrieval</text>
  <text x="631" y="132" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0B78CE">semantic query, 31-tool index</text>
  <text x="631" y="148" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#0B78CE">no vector DB · pip install moss</text>
  <text x="631" y="172" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#0B78CE">SHIPPED · retrieval.py</text>

  <line x1="731" y1="135" x2="795" y2="135" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="763" y="128" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B7280">+ context</text>

  <!-- Groq -->
  <rect x="799" y="90" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.5" />
  <text x="889" y="124" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2430">Groq LLM</text>
  <text x="889" y="142" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">sentiment classification</text>
  <text x="889" y="159" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8A8F98">only LLM hop in the app</text>

  <line x1="979" y1="135" x2="1043" y2="135" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1011" y="128" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B7280">raw JSON</text>

  <!-- Guardrails -->
  <rect x="1047" y="90" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.5" />
  <text x="1142" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2430">Runtime guardrails</text>
  <text x="1142" y="138" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">schema + index check</text>
  <text x="1142" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8A8F98">SHIPPED · Enkrypt AI proposed</text>

  <line x1="1237" y1="135" x2="1301" y2="135" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1269" y="128" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B7280">validated</text>

  <!-- Context Eval -->
  <rect x="1305" y="90" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.5" />
  <text x="1405" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2430">Context Eval</text>
  <text x="1405" y="138" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">Moss match OR regex</text>
  <text x="1405" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8A8F98">SHIPPED · Mastra eval proposed</text>

  <!-- Fallback dashed path: Moss -> Eval, bypassing Groq/Guardrails -->
  <path d="M 631 186 C 631 260, 1405 260, 1405 186" fill="none" stroke="#0B78CE" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-accent)" />
  <rect x="756" y="244" width="524" height="18" fill="#FFFFFF" />
  <text x="1018" y="257" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0B78CE">unconfigured / query fails → regex-only grounding</text>

  <!-- Eval branches down into row 2 -->
  <line x1="1405" y1="180" x2="1405" y2="340" stroke="#1F2430" stroke-width="1.5" />
  <line x1="1405" y1="340" x2="497" y2="340" stroke="#1F2430" stroke-width="1.5" />
  <line x1="497" y1="340" x2="497" y2="376" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="810" y="331" width="380" height="18" fill="#FFFFFF" />
  <text x="1000" y="344" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B7280">accepted label, or forced "neutral" when ungrounded</text>

  <!-- ══ Row 2: deterministic pipeline (y 380–466) ══ -->

  <rect x="407" y="380" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.5" />
  <text x="497" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2430">scoring.py</text>
  <text x="497" y="434" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">deterministic 0–100 score</text>
  <text x="497" y="452" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8A8F98">no model involved</text>

  <line x1="587" y1="423" x2="651" y2="423" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="619" y="416" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B7280">persist</text>

  <rect x="655" y="380" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.5" />
  <text x="745" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2430">Postgres / SQLite</text>
  <text x="745" y="434" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">Tool + ToolSnapshot</text>

  <line x1="835" y1="423" x2="899" y2="423" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="867" y="416" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B7280">read</text>

  <rect x="903" y="380" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.5" />
  <text x="993" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2430">FastAPI /api/v1</text>
  <text x="993" y="434" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">/status exposes retrieval stats</text>

  <line x1="1083" y1="423" x2="1147" y2="423" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1115" y="416" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B7280">fetch</text>

  <rect x="1151" y="380" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.5" />
  <text x="1241" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2430">Next.js frontend</text>
  <text x="1241" y="434" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">same-origin proxy, no CORS</text>

  <!-- Legend -->
  <rect x="30" y="490" width="14" height="14" fill="#EAF5FF" stroke="#0B78CE" stroke-width="2" />
  <text x="52" y="501" font-family="Arial, sans-serif" font-size="11" fill="#1F2430">Moss — the sprint's real sponsor product, not a placeholder</text>
  <line x1="440" y1="497" x2="472" y2="497" stroke="#0B78CE" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="480" y="501" font-family="Arial, sans-serif" font-size="11" fill="#1F2430">fallback path when Moss is unconfigured or a query fails</text>
  <text x="900" y="501" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#8A8F98">Full narrative: README.md "Hackathon Architecture" · docs/architecture/PRD.md</text>
</svg>
