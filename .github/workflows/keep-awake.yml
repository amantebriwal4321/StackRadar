name: Keep backend awake

# The backend runs on Render's free tier, which spins the service down after
# ~15 minutes of inactivity — so the first visitor after a quiet spell hits a
# ~30–50s cold-start wait. This pings the health endpoint on a schedule so the
# service stays warm and visitors get an instant load (matters most during a
# launch, when traffic arrives in waves).
#
# Notes:
#  - GitHub cron can be delayed several minutes under load, so */10 gives margin
#    under the 15-min sleep window without cutting it close.
#  - Actions minutes are unlimited on public repos; on a PRIVATE repo this uses
#    ~1 min/run against the monthly quota — if that matters, switch to a free
#    external pinger (cron-job.org / UptimeRobot) instead.
#  - GitHub auto-disables scheduled workflows after 60 days with no repo
#    activity; a normal commit cadence keeps it alive.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# If a run is still going when the next fires, skip the new one rather than pile up.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          URL="https://stackradar-backend-kbxl.onrender.com/api/v1/health"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          # Retry to ride out a cold wake — the first ping after a sleep can take
          # ~50s while the dyno boots. A browser-like UA avoids Cloudflare's
          # bot challenge on the *.onrender.com edge.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -m 75 -A "$UA" -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "backend awake (200)"
              exit 0
            fi
            sleep 15
          done
          # Don't fail loudly on a transient miss — the next scheduled run retries.
          echo "backend did not return 200 this run; will retry next cycle"
          exit 0
