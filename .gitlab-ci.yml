# GitLab CI for the Transcend hackathon. GitHub Actions, Vercel, and Render are unchanged.

stages:
  - test
  - lint
  - build
  - secure
  - deploy
  - smoke

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

variables:
  # Keep dependency scanning in this pipeline instead of a second MR pipeline.
  AST_ENABLE_MR_PIPELINES: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  interruptible: true

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      stage: secure
      allow_failure: true
      max_scan_depth: 2

# Scanners start immediately so a red test does not hide findings.
sast:
  stage: secure
  needs: []
  allow_failure: true

secret_detection:
  stage: secure
  needs: []
  allow_failure: true

dependency-scanning:
  needs: []
  allow_failure: true

test:backend:
  stage: test
  image: python:3.10-slim
  script:
    - pip install -r backend/requirements-dev.txt
    - cd backend && python -m pytest tests -q

test:mcp:
  stage: test
  image: python:3.10-slim
  script:
    - pip install -r mcp/requirements-dev.txt
    - cd mcp && python -m pytest tests -q

lint:backend:
  stage: lint
  image: python:3.10-slim
  script:
    - pip install -r backend/requirements-dev.txt
    - cd backend && ruff check app/ && ruff format --check app/

lint:frontend:
  stage: lint
  image: node:20-slim
  script:
    - cd frontend && npm ci && npx eslint .

lint:duo:
  stage: lint
  image: python:3.10-slim
  script:
    - pip install PyYAML==6.0.2
    - python scripts/check_duo_flows.py
    - python scripts/check_transcend_text.py
    - sh -n scripts/deploy_cloud_run.sh
    - sh -n scripts/seed-transcend-demo.sh

.build_docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - |
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i + 1))
        if [ "$i" -gt 20 ]; then
          docker info
          exit 1
        fi
        sleep 2
      done

build:backend:
  extends: .build_docker
  script:
    - docker build -t "stackradar-backend:${CI_COMMIT_SHORT_SHA}" backend

build:frontend:
  extends: .build_docker
  script:
    - docker build --build-arg BACKEND_ORIGIN=http://localhost:8000 -t "stackradar-frontend:${CI_COMMIT_SHORT_SHA}" frontend

build:mcp:
  extends: .build_docker
  script:
    - docker build -t "stackradar-mcp:${CI_COMMIT_SHORT_SHA}" mcp

# Present when the GCP variables are missing, so the pipeline log says why.
deploy:gate:
  stage: deploy
  image: alpine:3.20
  script:
    - |
      if [ -n "$GCP_PROJECT_ID" ] && [ -n "$GCP_REGION" ] && [ -n "$GCP_SA_KEY" ]; then
        echo "GCP variables are set."
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ "$CI_PIPELINE_SOURCE" = "push" ]; then
          echo "deploy:cloud-run runs on this default-branch push."
        elif [ "$DEPLOY_CLOUD_RUN" = "1" ]; then
          echo "deploy:cloud-run runs because DEPLOY_CLOUD_RUN is 1."
        else
          echo "Image builds already ran. Cloud Run waits for a default-branch push, or a pipeline with DEPLOY_CLOUD_RUN=1."
        fi
      else
        echo "Cloud Run deploy skipped. Set GCP_PROJECT_ID, GCP_REGION, and GCP_SA_KEY to enable it."
      fi

.gcp_rules:
  rules:
    - if: '$GCP_PROJECT_ID && $GCP_REGION && $GCP_SA_KEY && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$GCP_PROJECT_ID && $GCP_REGION && $GCP_SA_KEY && $CI_PIPELINE_SOURCE == "web" && $DEPLOY_CLOUD_RUN == "1"'
    - if: '$GCP_PROJECT_ID && $GCP_REGION && $GCP_SA_KEY && $CI_PIPELINE_SOURCE == "api" && $DEPLOY_CLOUD_RUN == "1"'
    - when: never

deploy:cloud-run:
  extends: .gcp_rules
  stage: deploy
  image: google/cloud-sdk:stable
  resource_group: cloud-run
  script:
    - sh scripts/deploy_cloud_run.sh
  artifacts:
    reports:
      dotenv: deploy.env

smoke:health:
  extends: .gcp_rules
  stage: smoke
  image:
    name: curlimages/curl:8.10.1
    entrypoint: [""]
  needs:
    - job: deploy:cloud-run
      artifacts: true
  script:
    - test -n "$CLOUD_RUN_URL"
    - test -n "$MCP_URL"
    - |
      code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --retry 8 --retry-delay 5 --retry-all-errors "$CLOUD_RUN_URL/api/v1/health")
      echo "GET $CLOUD_RUN_URL/api/v1/health -> $code"
      cat /tmp/health.json
      echo
      test "$code" = "200"
    - |
      mcode=$(curl -sS -o /tmp/mcp.json -w "%{http_code}" --retry 5 --retry-delay 3 --retry-all-errors "$MCP_URL/health")
      echo "GET $MCP_URL/health -> $mcode"
      cat /tmp/mcp.json
      echo
      test "$mcode" = "200"
