# Ruff configuration for the backend.
#
# Before this file existed, ruff ran on its built-in defaults, and CI installed
# whichever ruff was newest - so the rule set could change between two pushes
# with no commit. The version is pinned in requirements-dev.txt and ci.yml.

# The production image is python:3.10-slim (see Dockerfile). Upgrade
# suggestions must stay valid there: `X | None` yes, 3.11-only syntax no.
target-version = "py310"

[lint.flake8-bugbear]
# `db: Session = Depends(get_db)` is FastAPI's dependency-injection idiom, not
# a mutable default evaluated once. Every B008 finding in app/ was this.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[lint.per-file-ignores]
# Each fetcher's job is to return "no data from this source" rather than raise:
# one source timing out, changing its JSON shape or rate-limiting must never
# abort a scrape of the other four. A blind catch is the contract here, and
# every one of them logs. Anywhere else, BLE001 stands.
"app/services/scraper.py" = ["BLE001"]
